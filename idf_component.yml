version: "2.1.1"
license: "GPL-3.0"
description: "This is a library for managing lilygo devices."
url: https://github.com/Xinyuan-LilyGO/lilygo_device_driver

dependencies:
  idf: ">=5.5.3"

  llgok/cpp_bus_driver:
    version: "2.2.0"
    require: public
    matches:
      - if: "$CONFIG{LILYGO_DEVICE_DRIVER_T_GLASSES_P4} == True"
      - if: "$CONFIG{LILYGO_DEVICE_DRIVER_T_DISPLAY_P4} == True"
      - if: "$CONFIG{LILYGO_DEVICE_DRIVER_T_DISPLAY_P4_AIR} == True"

  espressif/esp_codec_dev:
    version: "1.5.10"
    require: public
    matches:
      - if: "$CONFIG{LILYGO_DEVICE_DRIVER_T_DISPLAY_P4_AIR} == True"

  lewisxhe/sensorlib:
    version: "0.4.1"
    require: public
    matches:
      - if: "$CONFIG{LILYGO_DEVICE_DRIVER_T_DISPLAY_P4_AIR} == True"

  usp_cpp_bus_driver:
    path: "../usp_cpp_bus_driver"
    require: public
    matches:
      - if: "$CONFIG{LILYGO_DEVICE_DRIVER_T_GLASSES_P4} == True"
      - if: "$CONFIG{LILYGO_DEVICE_DRIVER_T_DISPLAY_P4} == True"
      - if: "$CONFIG{LILYGO_DEVICE_DRIVER_T_DISPLAY_P4_AIR} == True"

  stsw-st25rfal002_cpp_bus_driver:
    path: "../stsw-st25rfal002_cpp_bus_driver"
    require: public
    matches:
      - if: "$CONFIG{LILYGO_DEVICE_DRIVER_T_DISPLAY_P4_AIR} == True"

  bhi2xy_sensorapi_cpp_bus_driver:
    path: "../bhi2xy_sensorapi_cpp_bus_driver"
    require: public
    matches:
      - if: "$CONFIG{LILYGO_DEVICE_DRIVER_T_DISPLAY_P4_AIR} == True"
